<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill:#ffffff; stroke:#2b6cb0; stroke-width:2; rx:10; }
    .box2 { fill:#ebf8ff; stroke:#2b6cb0; stroke-width:2; rx:10; }
    .core { fill:#2b6cb0; stroke:#1a4971; stroke-width:2; rx:10; }
    .label { font-size:14px; fill:#1a202c; text-anchor:middle; }
    .corelabel { font-size:16px; font-weight:bold; fill:#ffffff; text-anchor:middle; }
    .small { font-size:11px; fill:#4a5568; text-anchor:middle; }
    .arrow { stroke:#4a5568; stroke-width:2; fill:none; marker-end:url(#arrowhead); }
    .title { font-size:20px; font-weight:bold; fill:#1a202c; text-anchor:middle; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="500" y="30" class="title">SailPoint IdentityIQ — End-to-End IAM Architecture</text>

  <!-- HR Source -->
  <rect x="40" y="80" width="160" height="60" class="box2" rx="10"/>
  <text x="120" y="105" class="label">HR System</text>
  <text x="120" y="122" class="small">(Authoritative Source)</text>

  <!-- Arrow to core -->
  <path d="M200 110 H400" class="arrow"/>

  <!-- IdentityIQ core -->
  <rect x="400" y="60" width="220" height="100" class="core" rx="12"/>
  <text x="510" y="100" class="corelabel">SailPoint</text>
  <text x="510" y="122" class="corelabel">IdentityIQ</text>
  <text x="510" y="145" class="small" fill="#dbe9ff">Identity Cube · RBAC · Provisioning</text>

  <!-- Target apps -->
  <rect x="780" y="20" width="180" height="50" class="box" rx="10"/>
  <text x="870" y="50" class="label">Active Directory</text>
  <rect x="780" y="85" width="180" height="50" class="box" rx="10"/>
  <text x="870" y="115" class="label">ERP System</text>
  <rect x="780" y="150" width="180" height="50" class="box" rx="10"/>
  <text x="870" y="180" class="label">SaaS Apps</text>
  <rect x="780" y="215" width="180" height="50" class="box" rx="10"/>
  <text x="870" y="245" class="label">Databases</text>

  <path d="M620 90 H700 V45 H780" class="arrow"/>
  <path d="M620 100 H700 V110 H780" class="arrow"/>
  <path d="M620 110 H700 V175 H780" class="arrow"/>
  <path d="M620 120 H700 V240 H780" class="arrow"/>

  <!-- Supporting layers -->
  <rect x="380" y="260" width="80" height="70" class="box2" rx="10"/>
  <text x="420" y="285" class="label">RBAC</text>
  <text x="420" y="302" class="small">Role</text>
  <text x="420" y="315" class="small">Modeling</text>

  <rect x="470" y="260" width="80" height="70" class="box2" rx="10"/>
  <text x="510" y="285" class="label">Provisioning</text>
  <text x="510" y="302" class="small">Create /</text>
  <text x="510" y="315" class="small">Modify</text>

  <rect x="560" y="260" width="80" height="70" class="box2" rx="10"/>
  <text x="600" y="285" class="label">Certify</text>
  <text x="600" y="302" class="small">Access</text>
  <text x="600" y="315" class="small">Reviews</text>

  <rect x="650" y="260" width="100" height="70" class="box2" rx="10"/>
  <text x="700" y="285" class="label">Audit /</text>
  <text x="700" y="302" class="label">Logging</text>

  <path d="M460 260 V160" class="arrow"/>
  <path d="M510 260 V160" class="arrow"/>
  <path d="M600 260 V160" class="arrow"/>
  <path d="M700 260 V160" class="arrow"/>

  <!-- Lifecycle band -->
  <rect x="40" y="380" width="920" height="180" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" rx="10"/>
  <text x="500" y="405" class="title" font-size="16">Identity Lifecycle (JML)</text>

  <rect x="80" y="430" width="200" height="60" class="box" rx="10"/>
  <text x="180" y="455" class="label">Joiner</text>
  <text x="180" y="472" class="small">HR adds new hire → account created</text>

  <rect x="400" y="430" width="200" height="60" class="box" rx="10"/>
  <text x="500" y="455" class="label">Mover</text>
  <text x="500" y="472" class="small">Role/dept changes → access updated</text>

  <rect x="720" y="430" width="200" height="60" class="box" rx="10"/>
  <text x="820" y="455" class="label">Leaver</text>
  <text x="820" y="472" class="small">Termination → access revoked</text>

  <path d="M280 460 H400" class="arrow"/>
  <path d="M600 460 H720" class="arrow"/>

  <text x="500" y="535" class="small" font-size="12">Driven by identity attributes (department, title, status) evaluated against role assignment rules</text>
</svg>
