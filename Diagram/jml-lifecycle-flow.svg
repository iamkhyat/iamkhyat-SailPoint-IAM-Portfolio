<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill:#ffffff; stroke:#2f855a; stroke-width:2; rx:10; }
    .joiner { fill:#e6fffa; stroke:#2f855a; stroke-width:2; rx:10; }
    .mover { fill:#fffaf0; stroke:#c05621; stroke-width:2; rx:10; }
    .leaver { fill:#fff5f5; stroke:#c53030; stroke-width:2; rx:10; }
    .label { font-size:14px; fill:#1a202c; text-anchor:middle; font-weight:bold; }
    .small { font-size:11.5px; fill:#4a5568; text-anchor:middle; }
    .arrow { stroke:#4a5568; stroke-width:2; fill:none; marker-end:url(#arrowhead2); }
    .title { font-size:20px; font-weight:bold; fill:#1a202c; text-anchor:middle; }
    .sectiontitle { font-size:16px; font-weight:bold; text-anchor:start; }
  </style>
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4a5568"/>
    </marker>
  </defs>

  <text x="500" y="30" class="title">JML Lifecycle — Joiner / Mover / Leaver Flow</text>

  <!-- Shared starting point -->
  <rect x="400" y="55" width="200" height="55" class="box" rx="10"/>
  <text x="500" y="78" class="label">HR Data Change</text>
  <text x="500" y="95" class="small">aggregated into IdentityIQ</text>

  <path d="M500 110 V140" class="arrow"/>

  <rect x="400" y="140" width="200" height="55" class="box" rx="10"/>
  <text x="500" y="163" class="label">Identity Correlation</text>
  <text x="500" y="180" class="small">matched by email / employee ID</text>

  <path d="M500 195 V215" class="arrow"/>

  <rect x="380" y="215" width="240" height="55" class="box" rx="10"/>
  <text x="500" y="238" class="label">Lifecycle Event Detection</text>
  <text x="500" y="255" class="small">new identity? attribute change? terminated?</text>

  <!-- three branches -->
  <path d="M460 270 V300 H180 V330" class="arrow"/>
  <path d="M500 270 V330" class="arrow"/>
  <path d="M540 270 V300 H820 V330" class="arrow"/>

  <text x="180" y="320" class="sectiontitle" fill="#2f855a" text-anchor="middle">JOINER</text>
  <text x="500" y="320" class="sectiontitle" fill="#c05621" text-anchor="middle">MOVER</text>
  <text x="820" y="320" class="sectiontitle" fill="#c53030" text-anchor="middle">LEAVER</text>

  <!-- Joiner column -->
  <rect x="80" y="330" width="200" height="55" class="joiner"/>
  <text x="180" y="353" class="label">Create Identity</text>
  <text x="180" y="370" class="small">populate department, title, manager</text>
  <path d="M180 385 V410" class="arrow"/>
  <rect x="80" y="410" width="200" height="55" class="joiner"/>
  <text x="180" y="433" class="label">Assign Role(s)</text>
  <text x="180" y="450" class="small">based on attribute rules</text>
  <path d="M180 465 V490" class="arrow"/>
  <rect x="80" y="490" width="200" height="55" class="joiner"/>
  <text x="180" y="513" class="label">Provision Accounts</text>
  <text x="180" y="530" class="small">AD, email, ERP, etc.</text>
  <path d="M180 545 V570" class="arrow"/>
  <rect x="80" y="570" width="200" height="50" class="joiner"/>
  <text x="180" y="600" class="label">Day-1 Access Ready</text>

  <!-- Mover column -->
  <rect x="400" y="330" width="200" height="55" class="mover"/>
  <text x="500" y="353" class="label">Update Identity</text>
  <text x="500" y="370" class="small">dept/title attribute changes</text>
  <path d="M500 385 V410" class="arrow"/>
  <rect x="400" y="410" width="200" height="55" class="mover"/>
  <text x="500" y="433" class="label">Re-evaluate Roles</text>
  <text x="500" y="450" class="small">drop old role, add new role</text>
  <path d="M500 465 V490" class="arrow"/>
  <rect x="400" y="490" width="200" height="55" class="mover"/>
  <text x="500" y="513" class="label">Update Provisioning</text>
  <text x="500" y="530" class="small">add/remove entitlements</text>
  <path d="M500 545 V570" class="arrow"/>
  <rect x="400" y="570" width="200" height="50" class="mover"/>
  <text x="500" y="600" class="label">Access Matches New Role</text>

  <!-- Leaver column -->
  <rect x="720" y="330" width="200" height="55" class="leaver"/>
  <text x="820" y="353" class="label">Mark Inactive</text>
  <text x="820" y="370" class="small">status = terminated</text>
  <path d="M820 385 V410" class="arrow"/>
  <rect x="720" y="410" width="200" height="55" class="leaver"/>
  <text x="820" y="433" class="label">Remove All Roles</text>
  <text x="820" y="450" class="small">strip role assignments</text>
  <path d="M820 465 V490" class="arrow"/>
  <rect x="720" y="490" width="200" height="55" class="leaver"/>
  <text x="820" y="513" class="label">Deprovision Accounts</text>
  <text x="820" y="530" class="small">disable / delete everywhere</text>
  <path d="M820 545 V570" class="arrow"/>
  <rect x="720" y="570" width="200" height="50" class="leaver"/>
  <text x="820" y="600" class="label">Access Fully Revoked</text>

  <!-- footer note -->
  <rect x="80" y="650" width="840" height="70" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" rx="10"/>
  <text x="500" y="675" class="small" font-size="12.5" font-weight="bold">Where it breaks in practice:</text>
  <text x="500" y="695" class="small" font-size="11.5">Joiner — aggregation didn't run · Mover — stale role rules · Leaver — status not mapped, disable step never configured</text>
  <text x="500" y="710" class="small" font-size="11.5">All three depend on clean, current HR attribute data flowing in through aggregation.</text>
</svg>
