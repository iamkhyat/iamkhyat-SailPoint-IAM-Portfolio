<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box2{fill:#ebf8ff;stroke:#2b6cb0;stroke-width:2;rx:10;}
    .fixbox{fill:#e6fffa;stroke:#2f855a;stroke-width:2;rx:10;}
    .label{font-size:13.5px;fill:#1a202c;text-anchor:middle;font-weight:bold;}
    .small{font-size:11px;fill:#4a5568;text-anchor:middle;}
    .arrow{stroke:#4a5568;stroke-width:2;fill:none;marker-end:url(#a1);}
    .title{font-size:20px;font-weight:bold;fill:#1a202c;text-anchor:middle;}
  </style>
  <defs><marker id="a1" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#4a5568"/></marker></defs>

  <text x="520" y="30" class="title">IdentityIQ Certification Lifecycle</text>
  <text x="520" y="50" class="small">From campaign design to enforced remediation and audit-ready evidence</text>

  <rect x="40" y="80" width="200" height="70" class="box2"/>
  <text x="140" y="105" class="label">1. Campaign Design</text>
  <text x="140" y="123" class="small">scope, schedule,</text>
  <text x="140" y="137" class="small">risk-based targeting</text>
  <path d="M240 115 H290" class="arrow"/>

  <rect x="290" y="80" width="200" height="70" class="box2"/>
  <text x="390" y="105" class="label">2. Reviewer Assignment</text>
  <text x="390" y="123" class="small">manager or app owner —</text>
  <text x="390" y="137" class="small">whoever has real context</text>
  <path d="M490 115 H540" class="arrow"/>

  <rect x="540" y="80" width="200" height="70" class="box2"/>
  <text x="640" y="105" class="label">3. Reviewer Flow</text>
  <text x="640" y="123" class="small">notification → login →</text>
  <text x="640" y="137" class="small">review each item</text>
  <path d="M740 115 H790" class="arrow"/>

  <rect x="790" y="80" width="210" height="70" class="box2"/>
  <text x="895" y="105" class="label">4. Decision</text>
  <text x="895" y="123" class="small">Approve → access stands</text>
  <text x="895" y="137" class="small">Revoke → triggers remediation</text>

  <path d="M895 150 V190 H140 V220" class="arrow"/>

  <rect x="40" y="220" width="280" height="80" class="box2" stroke="#c53030" fill="#fff5f5"/>
  <text x="180" y="245" class="label" fill="#742a2a">5. Remediation</text>
  <text x="180" y="263" class="small">revocation request → provisioning</text>
  <text x="180" y="277" class="small">plan → connector executes removal</text>
  <text x="180" y="291" class="small">on the target system</text>
  <path d="M320 260 H380" class="arrow"/>

  <rect x="380" y="220" width="280" height="80" class="fixbox"/>
  <text x="520" y="245" class="label" fill="#22543d">6. Verification</text>
  <text x="520" y="263" class="small">confirm access actually removed —</text>
  <text x="520" y="277" class="small">a logged decision isn't enough,</text>
  <text x="520" y="291" class="small">the removal has to be real</text>
  <path d="M660 260 H720" class="arrow"/>

  <rect x="720" y="220" width="280" height="80" class="box2"/>
  <text x="860" y="245" class="label">7. Audit Trail</text>
  <text x="860" y="263" class="small">who decided what, when —</text>
  <text x="860" y="277" class="small">logs intact, reports ready</text>
  <text x="860" y="291" class="small">for SOX / GDPR evidence</text>

  <!-- Failure points -->
  <rect x="40" y="340" width="960" height="180" fill="#f7fafc" stroke="#cbd5e0" stroke-width="1.5" rx="10"/>
  <text x="520" y="365" class="label">Where Each Stage Actually Breaks</text>

  <text x="80" y="395" class="small" text-anchor="start" font-weight="bold">Campaign Design →</text>
  <text x="280" y="395" class="small" text-anchor="start">too broad → rubber-stamp approvals; too narrow → real risk missed</text>

  <text x="80" y="420" class="small" text-anchor="start" font-weight="bold">Reviewer Assignment →</text>
  <text x="280" y="420" class="small" text-anchor="start">org-chart changes outpace reviewer rules, item lands with nobody</text>

  <text x="80" y="445" class="small" text-anchor="start" font-weight="bold">Reviewer Flow →</text>
  <text x="280" y="445" class="small" text-anchor="start">raw entitlement codes confuse reviewers → uninformed decisions</text>

  <text x="80" y="470" class="small" text-anchor="start" font-weight="bold">Remediation →</text>
  <text x="280" y="470" class="small" text-anchor="start">revoke decision logged but provisioning fails silently downstream</text>

  <text x="80" y="495" class="small" text-anchor="start" font-weight="bold">Audit Trail →</text>
  <text x="280" y="495" class="small" text-anchor="start">logging misconfiguration means evidence doesn't exist when needed</text>
</svg>
